<script>
/* Appwrite: Project ID sudah diisi di setProject() di bawah */
const AW_DB="6ad9dd52002c9a3515c5", AW_TB="6ad9ddb1003bfff1dbbd";
const AW_BK="6adb08f1000096bf9798";
let client=null, awDB=null, awST=null, awErr="";
try{
  client = new Appwrite.Client()
    .setEndpoint("https://cloud.appwrite.io/v1")
    .setProject("6ad88656002543a81d90");
  awDB = new Appwrite.Databases(client);
  awST = new Appwrite.Storage(client);
  try{client.ping()}catch(e){}
}catch(e){awErr=(e&&e.message)||String(e);console.error("Appwrite init gagal:",e)}
/* Cek kesiapan Appwrite; mengembalikan teks masalah, atau "" kalau siap */
function awCheck(){
  if(typeof Appwrite==="undefined")return "SDK Appwrite gagal dimuat. Cek koneksi internet atau akses ke cdn.jsdelivr.net.";
  if(!awDB)return "Appwrite belum terhubung: "+awErr;
  const pid=client&&client.config&&client.config.project;
  if(!pid||pid==="ID_PROJECT_WMS")return "Project ID belum diisi di index.html (masih ID_PROJECT_WMS).";
  return "";
}
/* Data pengecekan -> Appwrite. ID dokumen = ID record, jadi aman dikirim berulang (tidak dobel) */
let awSyncing=false;
const awRec=r=>{const d=new Date(r.dt);return{
  checker:[r.c1,r.c2].filter(Boolean).join(" / ")||"-",
  job:r.job||"-",
  shift:r.shift||"-",
  tanggal:(isNaN(d)?new Date():d).toISOString(),
  ampere:Number(r.kA),
  deskripsi:r.desc||"",
  json:JSON.stringify(Object.assign({},r,{photo:""}))}};
/* Foto -> Appwrite Storage (bucket AW_BK). Data hanya menyimpan photoId; perangkat lain mengunduh foto dari bucket */
async function awPhotoUp(r){
  if(!r.photo||r.photoId||!awST)return;
  if(r.photo.startsWith("data:")&&r.photo.length>IMG_MAX){const d=await new Promise(ok=>imgPack(r.photo,ok));if(d&&d.length<r.photo.length)r.photo=d}
  const b=await (await fetch(r.photo)).blob(),fid="f"+String(r.id);
  try{await awST.createFile(AW_BK,fid,new File([b],fid+".jpg",{type:"image/jpeg"}))}
  catch(e){if(!(e&&e.code==409))throw e}
  r.photoId=fid;
  try{if(typeof _awSave==="function"&&D)_awSave(true)}catch(e){}
}
async function awPhotoGet(r){
  let href="";
  try{
    href=String(awST.getFileView(AW_BK,r.photoId));
    const res=await fetch(href);if(!res.ok)throw new Error("HTTP "+res.status);
    const b=await res.blob();
    r.photo=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(b)});
    return true;
  }catch(e){
    console.error("Foto gagal diunduh:",e);
    if(href){r.photo=href;return true}
    return false;
  }
}
async function awPhotosGet(list){
  let got=0;
  for(let k=0;k<list.length;k+=3){
    const rs=await Promise.all(list.slice(k,k+3).map(awPhotoGet));
    got+=rs.filter(Boolean).length;
  }
  return got;
}
async function awUpsert(r,retry){
  if(r.photo&&!r.photoId){try{await awPhotoUp(r)}catch(e){console.error("Foto gagal diunggah:",e);if(typeof toast==="function")toast("Foto gagal diunggah: "+((e&&e.message)||e))}}
  const id=String(r.id),data=awRec(r);
  try{
    try{await awDB.updateDocument(AW_DB,AW_TB,id,data)}
    catch(e){if(e&&e.code==404)await awDB.createDocument(AW_DB,AW_TB,id,data);else throw e}
  }catch(e){
    if(e&&e.code==429&&!retry){await new Promise(z=>setTimeout(z,1500));return awUpsert(r,true)}
    throw e;
  }
}
async function awPut(r){
  try{await awUpsert(r);console.log("Appwrite: data terkirim")}
  catch(e){console.error("Appwrite gagal:",e);if(typeof toast==="function")toast("Appwrite gagal: "+((e&&e.message)||e))}
}
async function awDel(id,pid){
  if(pid&&awST){try{await awST.deleteFile(AW_BK,String(pid))}catch(e){}}
  try{await awDB.deleteDocument(AW_DB,AW_TB,String(id))}catch(e){if(!(e&&e.code==404))console.error("Appwrite hapus gagal:",e)}
}
/* Tarik data dari server yang belum ada di perangkat ini (foto tidak ikut) */
async function awPullAll(silent){
  const u=U;
  try{
    const docs=[];let last=null;
    for(;;){
      const q=[Appwrite.Query.limit(100)];if(last)q.push(Appwrite.Query.cursorAfter(last));
      const r=await awDB.listDocuments(AW_DB,AW_TB,q);
      docs.push(...r.documents);
      if(r.documents.length<100)break;
      last=r.documents[r.documents.length-1].$id;
    }
    if(U!==u||!D)return -1;
    const have=new Map(D.insp.map(x=>[String(x.id),x]));let added=0,upd=0;const pend=[];
    for(const d of docs){
      if(!d.json)continue;
      let o;try{o=JSON.parse(d.json)}catch(e){continue}
      if(!o||!o.id)continue;
      const loc=have.get(String(o.id));
      if(loc){if((o.ea||0)>(loc.ea||0)){const ph=loc.photo,op=loc.photoId;Object.assign(loc,o);loc.photo=(o.photoId||'')==(op||'')?ph:'';upd++;if(!loc.photo&&o.photoId)pend.push(loc)}else if(!loc.photo&&o.photoId){loc.photoId=o.photoId;pend.push(loc)}continue}
      o.photo=o.photo||"";D.insp.push(o);have.set(String(o.id),o);added++;
      if(o.photoId&&!o.photo)pend.push(o);
    }
    const got=pend.length?await awPhotosGet(pend):0;
    if(U!==u||!D)return -1;
    if(added||got||upd){
      D.insp.sort((x,y)=>(y.created||0)-(x.created||0));
      _awSave(true);render();
      {const ps=[];if(added)ps.push(added+" data baru");if(upd)ps.push(upd+" data diperbarui");if(got)ps.push(got+" foto");toast(ps.join(", ")+" diambil dari server")}
    }
    return added;
  }catch(e){
    console.error("Appwrite ambil data gagal:",e);
    if(!silent)toast("Ambil data gagal: "+((e&&e.message)||e));
    return -1;
  }
}
/* Tombol "Update ke Server": kirim semua data lokal, lalu ambil data baru dari server */
async function awSyncAll(){
  if(awSyncing){toast("Update sedang berjalan...");return}
  const pre=awCheck();
  if(pre){alert(pre);return}
  awSyncing=true;toast("Memulai update ke server...");
  try{
    await awPullAll(true);
    let ok=0,fail=0,err="";
    const list=(D.insp||[]).slice();
    for(let k=0;k<list.length;k+=3){
      await Promise.all(list.slice(k,k+3).map(r=>awUpsert(r).then(()=>{ok++},e=>{fail++;err=(e&&e.message)||String(e);console.error("Appwrite gagal:",e)})));
      toast("Mengirim "+Math.min(k+3,list.length)+"/"+list.length+"...");
    }
    const added=await awPullAll(true);
    let m=ok+" data terkirim";
    if(added>0)m+=", "+added+" data baru dari server";
    if(fail)m+=", gagal "+fail+": "+err;
    if(added<0&&!fail)m+=" (ambil data dari server gagal)";
    if(!list.length&&added===0){toast("Belum ada data di perangkat ini, server juga kosong")}
    else if(!fail&&added>=0)awSuccess("Update berhasil",m);
    else alert(m);
  }catch(e){
    console.error("Update gagal:",e);alert("Update gagal: "+((e&&e.message)||e));
  }finally{awSyncing=false}
}
/* Suara "cling" (sintesis Web Audio, tanpa file) */
let awAC=null;
function awAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!awAC)awAC=new C();if(awAC.state==="suspended")awAC.resume();return awAC}catch(e){return null}}
document.addEventListener("pointerdown",awAudio,{passive:true});
function awCling(){
  try{if(localStorage.getItem("woms_mute")==="1")return}catch(e){}
  const a=awAudio();if(!a)return;
  try{
    const t=a.currentTime,g=a.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
    g.connect(a.destination);
    [[1318.5,0],[1975.5,0.09],[2637,0.09]].forEach(([f,d],i)=>{
      const o=a.createOscillator(),h=a.createGain();
      o.type="sine";o.frequency.value=f;h.gain.value=i==2?0.25:1;
      o.connect(h);h.connect(g);o.start(t+d);o.stop(t+1.2);
    });
  }catch(e){}
}
/* Animasi centang + notifikasi berhasil */
function awSuccess(title,sub){
  if(!document.getElementById("aw-css")){
    const st=document.createElement("style");st.id="aw-css";
    st.textContent=".aw-ok{position:fixed;top:0;left:0;width:100%;height:100%;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);animation:awf .2s}"+
    ".aw-card{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cd,#fff);color:var(--tx,#0f172a);border-radius:16px;padding:16px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:awp .3s;max-width:80%}"+
    ".aw-ok svg{display:block;margin:0 auto;flex:none}"+
    ".aw-ok circle{transform:rotate(-90deg);transform-origin:26px 26px}"+
    ".aw-ok circle{stroke-dasharray:166;stroke-dashoffset:166;animation:awd .6s .1s forwards}"+
    ".aw-ok path{stroke-dasharray:48;stroke-dashoffset:48;animation:awd .4s .6s forwards}"+
    "@keyframes awd{to{stroke-dashoffset:0}}@keyframes awf{from{opacity:0}}@keyframes awp{from{transform:scale(.8);opacity:0}}";
    document.head.appendChild(st);
  }
  const t=document.getElementById("t");if(t)t.style.display="none";
  const old=document.querySelector(".aw-ok");if(old)old.remove();
  const d=document.createElement("div");d.className="aw-ok";
  d.innerHTML='<div class="aw-card"><svg width="52" height="52" viewBox="-2 -2 56 56" fill="none" stroke="#16a34a" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="26" r="24" stroke-width="3"/><path d="M14 26l8 8 16-16" stroke-width="4"/></svg><div style="font-weight:700;font-size:15px;margin-top:6px">'+title+'</div><div style="font-size:12px;opacity:.7;margin-top:2px">'+sub+'</div></div>';
  d.onclick=()=>d.remove();
  document.body.appendChild(d);
  awCling();
  try{const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;if(H&&H.impact)H.impact({style:"LIGHT"});else if(navigator.vibrate)navigator.vibrate(40)}catch(e){}
  setTimeout(()=>{if(d.parentNode)d.remove()},2400);
}
</script>

let SC={t:0,busy:false,err:'',files:0,fb:0,docs:0,db:0};
const scCap=()=>(parseFloat(L.woms_srvcap)||2)*1073741824;

async function scLoad(force){
  if(SC.busy||(!force&&Date.now()-SC.t<300000))return;
  const pre=awCheck();if(pre){SC.err=pre;SC.t=Date.now();return}
  SC.busy=true;SC.err='';render();
  try{
    let fb=0,fn=0,last=null;
    for(;;){const q=[Appwrite.Query.limit(100)];if(last)q.push(Appwrite.Query.cursorAfter(last));
      const r=await awST.listFiles(AW_BK,q);r.files.forEach(f=>{fb+=f.sizeOriginal||0;fn++});
      if(r.files.length<100)break;last=r.files[r.files.length-1].$id}
    let db=0,dn=0;last=null;
    for(;;){const q=[Appwrite.Query.limit(100)];if(last)q.push(Appwrite.Query.cursorAfter(last));
      const r=await awDB.listDocuments(AW_DB,AW_TB,q);r.documents.forEach(d=>{db+=JSON.stringify(d).length;dn++});
      if(r.documents.length<100)break;last=r.documents[r.documents.length-1].$id}
    Object.assign(SC,{files:fn,fb,docs:dn,db});SC.t=Date.now();
    if((fb+db)/scCap()>=0.8)toast('Peringatan: kapasitas server sudah '+Math.round((fb+db)/scCap()*100)+'%')
  }catch(e){SC.err=(e&&e.message)||String(e);SC.t=Date.now()}
  SC.busy=false;if(tab=='setting')render()}

  return `<div class="c text-sm"><div class="flex justify-between items-center"><b>Kapasitas Server</b><button class="b" onclick="scLoad(true)" ${SC.busy?'disabled':''}>${SC.busy?'Memuat...':'&#8635; Refresh'}</button></div>
${SC.err?`<p class="text-xs my-2" style="color:#dc2626">Gagal membaca kapasitas: ${esc(SC.err)}</p>`:SC.t?`<p class="my-2"><b>${fmtB(used)}</b> terpakai dari <b>${fmtB(cap)}</b> (${pc.toFixed(1)}%)</p>

<div style="border:1px dashed var(--bd);border-radius:12px;padding:10px;margin-top:10px"><b>Parameter Baru</b><div class="flex gap-2 mt-2"><input id="wc_new" class="i" style="margin:0" placeholder="Nama parameter baru" onkeydown="if(event.key=='Enter')wcNew()"><button class="b" style="white-space:nowrap" onclick="wcNew()">+ New Item</button></div></div>`:''}</div>`}
function wcNew(){const el=$('#wc_new'),v=(el.value||'').trim();if(!v)return toast('Isi nama parameter');
  if(wcAll().some(x=>String(x[1]).toLowerCase()==v.toLowerCase()))return toast('Parameter sudah ada');
  const k='x'+Date.now().toString(36);(D.M.custom=D.M.custom||[]).push([k,v]);D.M[k]=[];save();render();toast('Parameter "'+v+'" ditambahkan')}
function wcDel(k){const c=(D.M.custom||[]).find(x=>x[0]==k);if(!c||!confirm(tr('Hapus parameter "'+c[1]+'" beserta isinya?')))return;D.M.custom=D.M.custom.filter(x=>x[0]!=k);delete D.M[k];save();render()}
/* progress bar simpan & update server */
const SP={p:0,show:false,err:false,t:0};
function spSet(p,err,hide){SP.p=p;SP.err=!!err;SP.show=true;clearTimeout(SP.t);const b=document.getElementById('spb'),w=document.getElementById('spw');if(w)w.style.visibility='visible';if(b){b.style.width=p+'%';b.style.background=err?'#ef4444':'#22c55e'}
  if(hide)SP.t=setTimeout(()=>{SP.show=false;SP.p=0;SP.err=false;const w=document.getElementById('spw'),b=document.getElementById('spb');if(w)w.style.visibility='hidden';if(b)b.style.width='0%'},err?2500:1500)}

const PENC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>';
function inGate(){return`<h1 class="text-lg font-extrabold py-3 text-blue-600">WELDING MONITORING SYSTEM</h1>
<div class="ig"><button type="button" class="inow" onclick="inGo(this)"><span class="ic">${PENC}</span><span class="tx">INPUT NOW</span></button><p class="text-xs opacity-60 mt-4">Tekan untuk mulai input data pengecekan</p></div>`}
function inGo(b){
  if(b.dataset.go)return;b.dataset.go='1';
  const r=b.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,go=()=>{IG=true;F.step=1;render();scrollTo(0,0);const a=$('#app');a.classList.remove('stp-in');void a.offsetWidth;a.classList.add('stp-in');setTimeout(()=>a.classList.remove('stp-in'),700)};
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return go();
  b.classList.add('go');
  const o=document.createElement('div');o.className='in-ov';o.style.cssText=`--x:${x}px;--y:${y}px`;o.innerHTML=`<div class="in-ov-c"><span>${PENC}</span><b>Step 1</b></div>`;document.body.appendChild(o);
  requestAnimationFrame(()=>requestAnimationFrame(()=>o.classList.add('on')));
  setTimeout(()=>{go();o.classList.add('off');setTimeout(()=>o.remove(),450)},720)}
function inHist(){
  const a=D.insp.slice(0,5);
  return`<div class="c mt-4"><button type="button" class="b w-full" onclick="IH.open=!IH.open;render()">${IH.open?'&#9650;':'&#9660;'} Input History</button>
${IH.open?(a.length?`<div class="mt-2">${a.map(i=>`<div class="flex justify-between items-center gap-2 py-2" style="border-top:1px solid var(--bd)"><div class="text-sm" style="min-width:0"><b>${esc(i.main)}${i.sub?' - '+esc(i.sub):''}</b><div class="text-xs opacity-70">${esc(i.loc||'-')} &middot; ${esc(i.mat||'-')} &middot; ${i.kA} kA (std ${i.min}-${i.max})</div><div class="text-xs opacity-60">${new Date(i.dt).toLocaleString(LC())}${i.c1?' &middot; '+esc([i.c1,i.c2].filter(Boolean).join(' / ')):''}</div></div>${st(i)}</div>`).join('')}</div>`:'<p class="text-sm opacity-60 text-center mt-3">Belum ada data input</p>'):''}</div>`}

async function bioEnable(e,name,p){
 try{
  const uid=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(e)));
  const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'WMS'},user:{id:uid,name:e,displayName:name||e},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},attestation:'none',timeout:60000}});

const AW_MT="6ad9e3270004fcc8e26d", AW_CH=15000;
let awLast=null, awBusy=false, awT=null;
const _awSave=save, _awLoad=load;
const awSnap=()=>JSON.stringify({mains:D.mains,M:D.M});
const awHdr=t=>{const m=/^(\d+)\/(\d+)\|/.exec(t||'');return m?{i:+m[1],n:+m[2],body:t.slice(m[0].length)}:null};
async function awMasterPull(){
  const u=U;
  try{
    const h=awHdr((await awDB.getDocument(AW_DB,AW_MT,'master_0')).data);
    if(!h) throw {code:404};
    let txt=h.body;
    for(let i=1;i<h.n;i++){const c=awHdr((await awDB.getDocument(AW_DB,AW_MT,'master_'+i)).data);txt+=c?c.body:''}
    const o=JSON.parse(txt);
    if(U!==u||!D) return;
    if(!D.masterT||o.t>D.masterT){
      D.mains=o.mains;D.M=o.M;D.masterT=o.t;norm();_awSave(true);awLast=awSnap();
      render();toast('Master diperbarui dari server');
    }else if(D.masterT>o.t){awLast='';awMasterPush()}
    else awLast=awSnap();
  }catch(e){
    if(e&&e.code==404&&U===u&&D){D.masterT=D.masterT||Date.now();_awSave(true);awLast='';awMasterPush()}
    else console.error('Appwrite master (ambil) gagal:',e);
  }
}
async function awMasterPush(){
  if(!D||!U)return false;
  if(awBusy){clearTimeout(awT);awT=setTimeout(awMasterPush,1500);return false}
  awBusy=true;
  try{
    const snap=awSnap();
    const json=JSON.stringify({t:D.masterT||Date.now(),mains:D.mains,M:D.M});
    const parts=[];for(let i=0;i<json.length;i+=AW_CH)parts.push(json.slice(i,i+AW_CH));
    let oldN=0;
    try{const h=awHdr((await awDB.getDocument(AW_DB,AW_MT,'master_0')).data);if(h)oldN=h.n}catch(e){}
    for(let i=0;i<parts.length;i++){
      const id='master_'+i,data={data:i+'/'+parts.length+'|'+parts[i]};
      try{await awDB.updateDocument(AW_DB,AW_MT,id,data)}
      catch(e){if(e&&e.code==404)await awDB.createDocument(AW_DB,AW_MT,id,data);else throw e}
    }
    for(let k=parts.length;k<oldN;k++){try{await awDB.deleteDocument(AW_DB,AW_MT,'master_'+k)}catch(e){}}
    awLast=snap;console.log('Appwrite: master terkirim');awBusy=false;return true;
  }catch(e){console.error('Appwrite master (kirim) gagal:',e);toast('Master gagal dikirim: '+((e&&e.message)||e))}
  awBusy=false;return false;
}
async function awMasterNow(){
  clearTimeout(awT);D.masterT=Date.now();_awSave(true);
  if(await awMasterPush())toast('Master terkirim ke server (semua perangkat)');
}
async function awUpdateServer(){
  if(awSyncing){toast("Update sedang berjalan...");return}
  const pre=awCheck();
  if(pre){alert(pre);return}
  if(!D||!U)return;
  awSyncing=true;toast("Mengirim setting ke server...");SC.t=0;
  try{
    clearTimeout(awT);D.masterT=Date.now();_awSave(true);
    let mok=await awMasterPush();
    if(!mok){await new Promise(z=>setTimeout(z,1600));mok=await awMasterPush()}
    await awPullAll(true);
    let ok=0,fail=0,err="";
    const list=(D.insp||[]).slice();
    for(let k=0;k<list.length;k+=3){
      await Promise.all(list.slice(k,k+3).map(r=>awUpsert(r).then(()=>{ok++},e=>{fail++;err=(e&&e.message)||String(e);console.error("Appwrite gagal:",e)})));
      toast("Mengirim data "+Math.min(k+3,list.length)+"/"+list.length+"...");
    }
    const added=await awPullAll(true);
    let m="Setting & master "+(mok?"terkirim":"GAGAL dikirim")+", "+ok+" data pengecekan terkirim";
    if(added>0)m+=", "+added+" data baru dari server";
    if(fail)m+=", gagal "+fail+": "+err;
    if(added<0&&!fail)m+=" (ambil data dari server gagal)";
    if(mok&&!fail&&added>=0){D.sync.last=new Date().toLocaleString(LC());_awSave(true);awSuccess("Update berhasil",m)}
    else alert(m);
    render();
  }catch(e){
    console.error("Update gagal:",e);alert("Update gagal: "+((e&&e.message)||e));
  }finally{awSyncing=false}
}
async function awSaveSync(r){
  const pre=awCheck();
  if(pre){toast("Tersimpan di perangkat. Server: "+pre);spSet(100,true,true);return}
  if(awSyncing){spSet(30,false);try{await awUpsert(r);spSet(100,false,true)}catch(e){spSet(100,true,true);toast("Kirim ke server gagal: "+((e&&e.message)||e))}return}
  awSyncing=true;toast("Mengirim ke server...");spSet(8,false);
  try{
    await awUpsert(r);spSet(40,false);
    let mok=true;
    if(D&&awLast!==null&&awSnap()!==awLast){clearTimeout(awT);D.masterT=Date.now();_awSave(true);mok=await awMasterPush()}
    spSet(60,false);
    await awMasterPull();spSet(78,false);
    const added=await awPullAll(true);spSet(94,false);
    if(D){D.sync.last=new Date().toLocaleString(LC());_awSave(true)}
    spSet(100,!(mok&&added>=0),true);
    let m="Data terkirim ke server";
    if(added>0)m+=", "+added+" data baru dari perangkat lain";
    if(mok&&added>=0)awSuccess("Tersimpan & terupdate",m);
    else alert(m+(mok?"":" (master gagal dikirim)")+(added<0?" (ambil data dari server gagal)":""));
  }catch(e){
    console.error("Simpan & update server gagal:",e);spSet(100,true,true);
    alert("Data tersimpan di perangkat, tetapi gagal dikirim ke server: "+((e&&e.message)||e)+". Coba lagi lewat tombol Update ke Server di tab Data.");
  }finally{awSyncing=false}
}

async function cloudClaim(e,n,p){

    const ui=await rid('u',e),u=await rdGet(ui);
    if(u&&u.x)return{ok:false,msg:'Akun ini sudah dihapus/diblokir admin'};
    const vi=await rid('v',e),v=await rdGet(vi);
