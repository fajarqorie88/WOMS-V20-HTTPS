<script>
/* Appwrite: Project ID sudah diisi di setProject() di bawah */
const AW_DB="6ad9dd52002c9a3515c5", AW_TB="6ad9ddb1003bfff1dbbd";
const AW_BK="6adb08f1000096bf9798";
let client=null, awDB=null, awST=null, awErr="";
try{
  client = new Appwrite.Client()
    .setEndpoint("https://cloud.appwrite.io/v1")
    .setProject("6ad88656002543a81d90");
  awDB = new Appwrite.Databases(client);
  awST = new Appwrite.Storage(client);
  try{client.ping()}catch(e){}
}catch(e){awErr=(e&&e.message)||String(e);console.error("Appwrite init gagal:",e)}
/* Cek kesiapan Appwrite; mengembalikan teks masalah, atau "" kalau siap */
function awCheck(){
  if(typeof Appwrite==="undefined")return "SDK Appwrite gagal dimuat. Cek koneksi internet atau akses ke cdn.jsdelivr.net.";
  if(!awDB)return "Appwrite belum terhubung: "+awErr;
  const pid=client&&client.config&&client.config.project;
  if(!pid||pid==="ID_PROJECT_WMS")return "Project ID belum diisi di index.html (masih ID_PROJECT_WMS).";
  return "";
}
/* Data pengecekan -> Appwrite. ID dokumen = ID record, jadi aman dikirim berulang (tidak dobel) */
let awSyncing=false;
const awRec=r=>{const d=new Date(r.dt);return{
  checker:[r.c1,r.c2].filter(Boolean).join(" / ")||"-",
  job:r.job||"-",
  shift:r.shift||"-",
  tanggal:(isNaN(d)?new Date():d).toISOString(),
  ampere:Number(r.kA),
  deskripsi:r.desc||"",
  json:JSON.stringify(Object.assign({},r,{photo:""}))}};
/* Foto -> Appwrite Storage (bucket AW_BK). Data hanya menyimpan photoId; perangkat lain mengunduh foto dari bucket */
async function awPhotoUp(r){
  if(!r.photo||r.photoId||!awST)return;
  if(r.photo.startsWith("data:")&&r.photo.length>IMG_MAX){const d=await new Promise(ok=>imgPack(r.photo,ok));if(d&&d.length<r.photo.length)r.photo=d}
  const b=await (await fetch(r.photo)).blob(),fid="f"+String(r.id);
  try{await awST.createFile(AW_BK,fid,new File([b],fid+".jpg",{type:"image/jpeg"}))}
  catch(e){if(!(e&&e.code==409))throw e}
  r.photoId=fid;
  try{if(typeof _awSave==="function"&&D)_awSave(true)}catch(e){}
}
async function awPhotoGet(r){
  let href="";
  try{
    href=String(awST.getFileView(AW_BK,r.photoId));
    const res=await fetch(href);if(!res.ok)throw new Error("HTTP "+res.status);
    const b=await res.blob();
    r.photo=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(b)});
    return true;
  }catch(e){
    console.error("Foto gagal diunduh:",e);
    if(href){r.photo=href;return true}
    return false;
  }
}
async function awPhotosGet(list){
  let got=0;
  for(let k=0;k<list.length;k+=3){
    const rs=await Promise.all(list.slice(k,k+3).map(awPhotoGet));
    got+=rs.filter(Boolean).length;
  }
  return got;
}
async function awUpsert(r,retry){
  if(r.photo&&!r.photoId){try{await awPhotoUp(r)}catch(e){console.error("Foto gagal diunggah:",e);if(typeof toast==="function")toast("Foto gagal diunggah: "+((e&&e.message)||e))}}
  const id=String(r.id),data=awRec(r);
  try{
    try{await awDB.updateDocument(AW_DB,AW_TB,id,data)}
    catch(e){if(e&&e.code==404)await awDB.createDocument(AW_DB,AW_TB,id,data);else throw e}
  }catch(e){
    if(e&&e.code==429&&!retry){await new Promise(z=>setTimeout(z,1500));return awUpsert(r,true)}
    throw e;
  }
}
async function awPut(r){
  try{await awUpsert(r);console.log("Appwrite: data terkirim")}
  catch(e){console.error("Appwrite gagal:",e);if(typeof toast==="function")toast("Appwrite gagal: "+((e&&e.message)||e))}
}
async function awDel(id,pid){
  if(pid&&awST){try{await awST.deleteFile(AW_BK,String(pid))}catch(e){}}
  try{await awDB.deleteDocument(AW_DB,AW_TB,String(id))}catch(e){if(!(e&&e.code==404))console.error("Appwrite hapus gagal:",e)}
}
/* Tarik data dari server yang belum ada di perangkat ini (foto tidak ikut) */
async function awPullAll(silent){
  const u=U;
  try{
    const docs=[];let last=null;
    for(;;){
      const q=[Appwrite.Query.limit(100)];if(last)q.push(Appwrite.Query.cursorAfter(last));
      const r=await awDB.listDocuments(AW_DB,AW_TB,q);
      docs.push(...r.documents);
      if(r.documents.length<100)break;
      last=r.documents[r.documents.length-1].$id;
    }
    if(U!==u||!D)return -1;
    const have=new Map(D.insp.map(x=>[String(x.id),x]));let added=0;const pend=[];
    for(const d of docs){
      if(!d.json)continue;
      let o;try{o=JSON.parse(d.json)}catch(e){continue}
      if(!o||!o.id)continue;
      const loc=have.get(String(o.id));
      if(loc){if(!loc.photo&&o.photoId){loc.photoId=o.photoId;pend.push(loc)}continue}
      o.photo=o.photo||"";D.insp.push(o);have.set(String(o.id),o);added++;
      if(o.photoId&&!o.photo)pend.push(o);
    }
    const got=pend.length?await awPhotosGet(pend):0;
    if(U!==u||!D)return -1;
    if(added||got){
      D.insp.sort((x,y)=>(y.created||0)-(x.created||0));
      _awSave(true);render();
      toast((added?added+" data baru":"")+(added&&got?", ":"")+(got?got+" foto":"")+" diambil dari server");
    }
    return added;
  }catch(e){
    console.error("Appwrite ambil data gagal:",e);
    if(!silent)toast("Ambil data gagal: "+((e&&e.message)||e));
    return -1;
  }
}
/* Tombol "Update ke Server": kirim semua data lokal, lalu ambil data baru dari server */
async function awSyncAll(){
  if(awSyncing){toast("Update sedang berjalan...");return}
  const pre=awCheck();
  if(pre){alert(pre);return}
  awSyncing=true;toast("Memulai update ke server...");
  try{
    let ok=0,fail=0,err="";
    const list=(D.insp||[]).slice();
    for(let k=0;k<list.length;k+=3){
      await Promise.all(list.slice(k,k+3).map(r=>awUpsert(r).then(()=>{ok++},e=>{fail++;err=(e&&e.message)||String(e);console.error("Appwrite gagal:",e)})));
      toast("Mengirim "+Math.min(k+3,list.length)+"/"+list.length+"...");
    }
    const added=await awPullAll(true);
    let m=ok+" data terkirim";
    if(added>0)m+=", "+added+" data baru dari server";
    if(fail)m+=", gagal "+fail+": "+err;
    if(added<0&&!fail)m+=" (ambil data dari server gagal)";
    if(!list.length&&added===0){toast("Belum ada data di perangkat ini, server juga kosong")}
    else if(!fail&&added>=0)awSuccess("Update berhasil",m);
    else alert(m);
  }catch(e){
    console.error("Update gagal:",e);alert("Update gagal: "+((e&&e.message)||e));
  }finally{awSyncing=false}
}
/* Suara "cling" (sintesis Web Audio, tanpa file) */
let awAC=null;
function awAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!awAC)awAC=new C();if(awAC.state==="suspended")awAC.resume();return awAC}catch(e){return null}}
document.addEventListener("pointerdown",awAudio,{passive:true});
function awCling(){
  try{if(localStorage.getItem("woms_mute")==="1")return}catch(e){}
  const a=awAudio();if(!a)return;
  try{
    const t=a.currentTime,g=a.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
    g.connect(a.destination);
    [[1318.5,0],[1975.5,0.09],[2637,0.09]].forEach(([f,d],i)=>{
      const o=a.createOscillator(),h=a.createGain();
      o.type="sine";o.frequency.value=f;h.gain.value=i==2?0.25:1;
      o.connect(h);h.connect(g);o.start(t+d);o.stop(t+1.2);
    });
  }catch(e){}
}
/* Animasi centang + notifikasi berhasil */
function awSuccess(title,sub){
  if(!document.getElementById("aw-css")){
    const st=document.createElement("style");st.id="aw-css";
    st.textContent=".aw-ok{position:fixed;top:0;left:0;width:100%;height:100%;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);animation:awf .2s}"+
    ".aw-card{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cd,#fff);color:var(--tx,#0f172a);border-radius:16px;padding:16px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:awp .3s;max-width:80%}"+
    ".aw-ok svg{display:block;margin:0 auto;flex:none}"+
    ".aw-ok circle{transform:rotate(-90deg);transform-origin:26px 26px}"+
    ".aw-ok circle{stroke-dasharray:166;stroke-dashoffset:166;animation:awd .6s .1s forwards}"+
    ".aw-ok path{stroke-dasharray:48;stroke-dashoffset:48;animation:awd .4s .6s forwards}"+
    "@keyframes awd{to{stroke-dashoffset:0}}@keyframes awf{from{opacity:0}}@keyframes awp{from{transform:scale(.8);opacity:0}}";
    document.head.appendChild(st);
  }
  const t=document.getElementById("t");if(t)t.style.display="none";
  const old=document.querySelector(".aw-ok");if(old)old.remove();
  const d=document.createElement("div");d.className="aw-ok";
  d.innerHTML='<div class="aw-card"><svg width="52" height="52" viewBox="-2 -2 56 56" fill="none" stroke="#16a34a" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="26" r="24" stroke-width="3"/><path d="M14 26l8 8 16-16" stroke-width="4"/></svg><div style="font-weight:700;font-size:15px;margin-top:6px">'+title+'</div><div style="font-size:12px;opacity:.7;margin-top:2px">'+sub+'</div></div>';
  d.onclick=()=>d.remove();
  document.body.appendChild(d);
  awCling();
  try{const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;if(H&&H.impact)H.impact({style:"LIGHT"});else if(navigator.vibrate)navigator.vibrate(40)}catch(e){}
  setTimeout(()=>{if(d.parentNode)d.remove()},2400);
}
</script>

.sw-del:active{background:#b91c1c}
.sw-c.open .sw-del,.sw-c.drag .sw-del{opacity:1}
@keyframes swH{0%,100%{transform:none}30%,70%{transform:translateX(-52px)}}
@keyframes swHB{0%,100%{opacity:0}30%,70%{opacity:1}}
.sw-c.hint .sw-in{animation:swH 1.7s ease .6s 1}
.sw-c.hint .sw-del{animation:swHB 1.7s ease .6s 1}

.cb{position:relative}

.cb-b{position:absolute;right:4px;top:3px;bottom:11px;width:36px;border:0;background:transparent;color:var(--tx);opacity:.6;font-size:16px}

.cb-o:last-child{border-bottom:0}

.cb-o:active{background:var(--bd)}
.c:has(.cb-l.show){position:relative;z-index:40}

const AW_MT="6ad9e3270004fcc8e26d", AW_CH=15000;
let awLast=null, awBusy=false, awT=null;
const _awSave=save, _awLoad=load;
const awSnap=()=>JSON.stringify({mains:D.mains,M:D.M});
const awHdr=t=>{const m=/^(\d+)\/(\d+)\|/.exec(t||'');return m?{i:+m[1],n:+m[2],body:t.slice(m[0].length)}:null};
async function awMasterPull(){
  const u=U;
  try{
    const h=awHdr((await awDB.getDocument(AW_DB,AW_MT,'master_0')).data);
    if(!h) throw {code:404};
    let txt=h.body;
    for(let i=1;i<h.n;i++){const c=awHdr((await awDB.getDocument(AW_DB,AW_MT,'master_'+i)).data);txt+=c?c.body:''}
    const o=JSON.parse(txt);
    if(U!==u||!D) return;
    if(!D.masterT||o.t>D.masterT){
      D.mains=o.mains;D.M=o.M;D.masterT=o.t;norm();_awSave(true);awLast=awSnap();
      render();toast('Master diperbarui dari server');
    }else if(D.masterT>o.t){awLast='';awMasterPush()}
    else awLast=awSnap();
  }catch(e){
    if(e&&e.code==404&&U===u&&D){D.masterT=D.masterT||Date.now();_awSave(true);awLast='';awMasterPush()}
    else console.error('Appwrite master (ambil) gagal:',e);
  }
}
async function awMasterPush(){
  if(!D||!U)return false;
  if(awBusy){clearTimeout(awT);awT=setTimeout(awMasterPush,1500);return false}
  awBusy=true;
  try{
    const snap=awSnap();
    const json=JSON.stringify({t:D.masterT||Date.now(),mains:D.mains,M:D.M});
    const parts=[];for(let i=0;i<json.length;i+=AW_CH)parts.push(json.slice(i,i+AW_CH));
    let oldN=0;
    try{const h=awHdr((await awDB.getDocument(AW_DB,AW_MT,'master_0')).data);if(h)oldN=h.n}catch(e){}
    for(let i=0;i<parts.length;i++){
      const id='master_'+i,data={data:i+'/'+parts.length+'|'+parts[i]};
      try{await awDB.updateDocument(AW_DB,AW_MT,id,data)}
      catch(e){if(e&&e.code==404)await awDB.createDocument(AW_DB,AW_MT,id,data);else throw e}
    }
    for(let k=parts.length;k<oldN;k++){try{await awDB.deleteDocument(AW_DB,AW_MT,'master_'+k)}catch(e){}}
    awLast=snap;console.log('Appwrite: master terkirim');awBusy=false;return true;
  }catch(e){console.error('Appwrite master (kirim) gagal:',e);toast('Master gagal dikirim: '+((e&&e.message)||e))}
  awBusy=false;return false;
}
async function awMasterNow(){
  clearTimeout(awT);D.masterT=Date.now();_awSave(true);
  if(await awMasterPush())toast('Master terkirim ke server (semua perangkat)');
}
async function awUpdateServer(){
  if(awSyncing){toast("Update sedang berjalan...");return}
  const pre=awCheck();
  if(pre){alert(pre);return}
  if(!D||!U)return;
  awSyncing=true;toast("Mengirim setting ke server...");
  try{
    clearTimeout(awT);D.masterT=Date.now();_awSave(true);
    let mok=await awMasterPush();
    if(!mok){await new Promise(z=>setTimeout(z,1600));mok=await awMasterPush()}
    let ok=0,fail=0,err="";
    const list=(D.insp||[]).slice();
    for(let k=0;k<list.length;k+=3){
      await Promise.all(list.slice(k,k+3).map(r=>awUpsert(r).then(()=>{ok++},e=>{fail++;err=(e&&e.message)||String(e);console.error("Appwrite gagal:",e)})));
      toast("Mengirim data "+Math.min(k+3,list.length)+"/"+list.length+"...");
    }
    const added=await awPullAll(true);
    let m="Setting & master "+(mok?"terkirim":"GAGAL dikirim")+", "+ok+" data pengecekan terkirim";
    if(added>0)m+=", "+added+" data baru dari server";
    if(fail)m+=", gagal "+fail+": "+err;
    if(added<0&&!fail)m+=" (ambil data dari server gagal)";
    if(mok&&!fail&&added>=0){D.sync.last=new Date().toLocaleString(LC());_awSave(true);awSuccess("Update berhasil",m)}
    else alert(m);
    render();
  }catch(e){
    console.error("Update gagal:",e);alert("Update gagal: "+((e&&e.message)||e));
  }finally{awSyncing=false}
}
async function awSaveSync(r){
  const pre=awCheck();
  if(pre){toast("Tersimpan di perangkat. Server: "+pre);return}
  if(awSyncing){try{await awUpsert(r)}catch(e){toast("Kirim ke server gagal: "+((e&&e.message)||e))}return}
  awSyncing=true;toast("Mengirim ke server...");
  try{
    await awUpsert(r);
    let mok=true;
    if(D&&awLast!==null&&awSnap()!==awLast){clearTimeout(awT);D.masterT=Date.now();_awSave(true);mok=await awMasterPush()}
    await awMasterPull();
    const added=await awPullAll(true);
    if(D){D.sync.last=new Date().toLocaleString(LC());_awSave(true)}
    let m="Data terkirim ke server";
    if(added>0)m+=", "+added+" data baru dari perangkat lain";
    if(mok&&added>=0)awSuccess("Tersimpan & terupdate",m);
    else alert(m+(mok?"":" (master gagal dikirim)")+(added<0?" (ambil data dari server gagal)":""));
  }catch(e){
    console.error("Simpan & update server gagal:",e);
    alert("Data tersimpan di perangkat, tetapi gagal dikirim ke server: "+((e&&e.message)||e)+". Coba lagi lewat tombol Update ke Server di tab Data.");
  }finally{awSyncing=false}
}

/* --- kripto: verifier password (PBKDF2 + salt) supaya email developer tidak bisa "diklaim" orang lain --- */
const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhx=s=>new Uint8Array((s.match(/../g)||[]).map(x=>parseInt(x,16)));
async function pbk(p,s){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return hx(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:s,iterations:150000},k,256))}
async function mkVer(e,p){const s=crypto.getRandomValues(new Uint8Array(16));return{s:hx(s),h:await pbk(e+'|'+p,s)}}
async function chkVer(v,e,p){return (await pbk(e+'|'+p,unhx(v.s)))===v.h}
/* --- penyimpanan di Appwrite (koleksi master): u_=akun, v_=verifier, p_=presence --- */
const rid=async(k,e)=>k+'_'+(await sha('wms|'+String(e).toLowerCase())).slice(0,32);
async function rdGet(id){try{const d=await awDB.getDocument(AW_DB,AW_MT,id);return JSON.parse(d.data)}catch(e){if(e&&e.code==404)return null;throw e}}
async function rdSet(id,o){const data={data:JSON.stringify(o)};try{await awDB.updateDocument(AW_DB,AW_MT,id,data)}catch(e){if(e&&e.code==404)await awDB.createDocument(AW_DB,AW_MT,id,data);else throw e}}
const cloudOff=()=>!!awCheck()||!navigator.onLine;
/* Saat daftar: cek email belum dipakai / tidak diblokir di server */
async function cloudClaim(e,n,p){
  if(cloudOff())return{ok:true};
  try{
    const ui=await rid('u',e),u=await rdGet(ui);
    if(u&&u.x)return{ok:false,msg:'Akun ini sudah dihapus/diblokir admin'};
    const vi=await rid('v',e),v=await rdGet(vi);
    if(v){return(await chkVer(v,e,p))?{ok:true}:{ok:false,msg:'Email sudah terdaftar di server dengan password lain'}}
    await rdSet(vi,await mkVer(e,p));
    if(!u)await rdSet(ui,{e,n,r:'user',c:Date.now(),l:Date.now()});
    return{ok:true};
  }catch(x){console.error('claim',x);return{ok:true}}
}
async function cloudPw(e,np){if(cloudOff())return;try{await rdSet(await rid('v',e),await mkVer(e,np))}catch(x){console.error('pw',x)}}
/* Dijalankan sekali setiap sesi login: daftarkan akun, cek role, mulai presence */
async function cloudBoot(){
  const e=myEm(),pw=_lp;_lp='';CB=e;if(!e)return;
  clearInterval(hbT);hbT=setInterval(cloudBeat,HB_MS);
  if(cloudOff())return;
  try{
    const ui=await rid('u',e);let u=await rdGet(ui);
    if(u&&u.x)return forceOut();
    if(isDevEm(e)){
      const vi=await rid('v',e),v=await rdGet(vi);
      if(v&&pw){devBad=!(await chkVer(v,e,pw));if(devBad)toast('Email developer ini sudah diklaim dengan password lain. Akses developer dinonaktifkan.')}
      else if(!v&&pw)await rdSet(vi,await mkVer(e,pw));
    }
    if(!u){u={e,n:(U&&U.name)||e,r:'user',c:Date.now(),l:Date.now()};await rdSet(ui,u)}
    const r=isDevEm(e)?'admin':(u.r||'user'),ch=rlGet()!==r;
    try{L['woms_rl_'+e]=r}catch(x){}
    await rdSet(await rid('p',e),{e,n:(U&&U.name)||e,t:Date.now(),on:1});
    if(ch||devBad)render();
  }catch(x){console.error('boot',x)}
}
async function cloudBeat(){
  if(!U||cloudOff())return;const e=myEm();
  try{
    const ui=await rid('u',e),u=await rdGet(ui);
    if(!U||myEm()!=e)return;
    if(u&&u.x)return forceOut();
    if(!u)await rdSet(ui,{e,n:U.name||e,r:'user',c:Date.now(),l:Date.now()});
    const r=isDevEm(e)?'admin':((u&&u.r)||'user');
    if(rlGet()!==r){try{L['woms_rl_'+e]=r}catch(x){}render()}
    await rdSet(await rid('p',e),{e,n:U.name||e,t:Date.now(),on:1});
  }catch(x){console.error('beat',x)}
}
function presOff(){try{if(U&&!cloudOff()){const e=myEm(),n=U.name||e;rid('p',e).then(id=>rdSet(id,{e,n,t:Date.now(),on:0})).catch(()=>{})}}catch(x){}}
function cloudStop(){clearInterval(hbT);CB='';devBad=false;AC=[];acErr=''}
/* Akun dihapus admin: keluarkan paksa dari perangkat ini */
function forceOut(){
  const e=myEm(),id=U&&U.id;clearInterval(hbT);clearTimeout(saveT);
  try{const ac=accs();delete ac[e];L.woms_acc=JSON.stringify(ac)}catch(x){}
  try{if(typeof bioOff==='function')bioOff(e)}catch(x){}
  ['woms_user','woms_lock','woms_token','woms_rl_'+e,'woms_data_'+id,'woms_bn_'+e].forEach(k=>{try{L.removeItem(k)}catch(x){}});
  U=D=null;TOK='';LV='menu';CB='';devBad=false;scr='home';render();
  alert('Akun Anda telah dihapus oleh administrator. Hubungi admin jika ini keliru.');
}
const _lgo=logout;logout=function(){presOff();cloudStop();_lgo()};
const _lck=lock;lock=function(w){presOff();cloudStop();_lck(w)};
/* --- UI Monitoring Akun (khusus Developer / Master Admin) --- */
function ago(t){if(!t)return '-';const s=Math.max(0,(Date.now()-t)/1000|0);if(s<60)return 'baru saja';if(s<3600)return (s/60|0)+' mnt lalu';if(s<86400)return (s/3600|0)+' jam lalu';return new Date(t).toLocaleDateString(LC())}
function acCard(){return`<div class="c"><div class="flex justify-between items-center"><b>Monitoring Akun</b><button class="b b2" onclick="acLoad()">&#8635; Refresh</button></div><p class="text-xs opacity-60 my-1">Hanya terlihat oleh Developer / Master Admin. Online = aktif dalam 2,5 menit terakhir. Admin dapat membuka tab Setting &amp; Master.</p><input class="i" placeholder="Cari nama / email" value="${esc(acQ)}" oninput="acQ=this.value;acDraw()"><div id="acl" class="text-sm"></div></div>`}
function acDraw(){const el=$('#acl');if(!el)return;
  if(acErr){el.innerHTML=`<p class="text-xs" style="color:#dc2626">${esc(acErr)}</p>`;return}
  const now=Date.now(),q=acQ.trim().toLowerCase();
  const on=a=>!!(a.p&&a.p.on&&now-a.p.t<ON_MS),seen=a=>(a.p&&a.p.t)||a.l||a.c||0;
  const rows=AC.filter(a=>!q||(String(a.e)+' '+(a.n||'')).toLowerCase().includes(q));
  const act=rows.filter(a=>!a.x).sort((a,b)=>(on(b)-on(a))||(seen(b)-seen(a))),del=rows.filter(a=>a.x);
  const nOn=AC.filter(a=>!a.x&&on(a)).length,nAll=AC.filter(a=>!a.x).length;
  const row=a=>{const dv=isDevEm(a.e),o=on(a),rl=dv?'Developer':a.r=='admin'?'Admin':'User',nw=!a.x&&a.c&&now-a.c<3*864e5;
    const st=a.x?'&#128683; Dihapus '+ago(a.xt):o?'<span style="color:#16a34a">&#9679; Online</span>':'&#9675; Terakhir aktif '+ago(seen(a));
    const bt=dv?'':a.x?`<button class="b b2" onclick="acRestore('${a.h}')">Pulihkan</button>`:`<button class="b ${a.r=='admin'?'b2':''}" onclick="acRole('${a.h}','${a.r=='admin'?'user':'admin'}')">${a.r=='admin'?'Cabut Admin':'Jadikan Admin'}</button><button class="b bd" onclick="acDel('${a.h}')">Hapus</button>`;
    return`<div class="py-2" style="border-top:1px solid rgba(128,128,128,.25)"><div class="flex justify-between items-start gap-2"><div style="min-width:0"><b>${esc(a.n||'-')}</b>${nw?' <span class="bg">BARU</span>':''}<div class="text-xs opacity-70" style="word-break:break-all">${esc(a.e)}</div><div class="text-xs mt-1">${st} - ${rl}</div></div><div class="flex flex-col gap-1" style="flex:none">${bt}</div></div></div>`};
  el.innerHTML=`<p class="text-xs my-2"><b>${nOn}</b> online dari ${nAll} akun</p>`+(act.map(row).join('')||'<p class="text-xs opacity-60">Belum ada akun.</p>')+(del.length?`<p class="text-xs mt-3 opacity-70"><b>Akun dihapus (${del.length})</b></p>`+del.map(row).join(''):'');
  trDom(el)}
async function acLoad(){
  if(!isDev()||acBusy)return;
  const pre=awCheck();if(pre){acErr=pre;acDraw();return}
  acBusy=true;acDraw();
  try{
    const docs=[];let last=null;
    for(;;){const q=[Appwrite.Query.limit(100)];if(last)q.push(Appwrite.Query.cursorAfter(last));const r=await awDB.listDocuments(AW_DB,AW_MT,q);docs.push(...r.documents);if(r.documents.length<100)break;last=r.documents[r.documents.length-1].$id}
    const us={},ps={};
    for(const d of docs){const id=d.$id;if(id[1]!='_')continue;let o;try{o=JSON.parse(d.data)}catch(e){continue}if(id[0]=='u')us[id.slice(2)]=o;else if(id[0]=='p')ps[id.slice(2)]=o}
    AC=Object.keys(us).map(h=>Object.assign({h,p:ps[h]},us[h]));acErr='';
  }catch(e){console.error('acLoad',e);acErr='Gagal memuat akun: '+((e&&e.message)||e)}
  acBusy=false;acDraw();
}
const acErrT=e=>toast('Gagal: '+((e&&e.message)||e));
async function acRole(h,r){if(!isDev())return;
  try{const id='u_'+h,u=await rdGet(id);if(!u)return toast('Akun tidak ditemukan');if(isDevEm(u.e))return;
    if(r=='admin'&&!confirm('Jadikan '+(u.n||u.e)+' sebagai Admin?'))return;
    u.r=r;await rdSet(id,u);toast(r=='admin'?'Admin ditambahkan':'Admin dicabut');acLoad()}catch(e){acErrT(e)}}
async function acDel(h){if(!isDev())return;
  try{const id='u_'+h,u=await rdGet(id);if(!u)return;
    if(isDevEm(u.e)||String(u.e).toLowerCase()==myEm())return toast('Akun ini tidak bisa dihapus');
    if(!confirm('Hapus akun '+(u.n||'')+' ('+u.e+')?\n\nAkun akan dikeluarkan dari semua perangkat dan tidak bisa login/daftar lagi sampai dipulihkan. Data pengecekan yang sudah ada di server tidak ikut terhapus.'))return;
    u.x=1;u.xt=Date.now();u.xb=myEm();u.r='user';await rdSet(id,u);
    try{await awDB.deleteDocument(AW_DB,AW_MT,'p_'+h)}catch(x){}
    toast('Akun dihapus');acLoad()}catch(e){acErrT(e)}}
async function acRestore(h){if(!isDev())return;
  try{const id='u_'+h,u=await rdGet(id);if(!u)return;delete u.x;delete u.xt;delete u.xb;await rdSet(id,u);toast('Akun dipulihkan');acLoad()}catch(e){acErrT(e)}}
setInterval(()=>{if(U&&scr=='app'&&tab=='setting'&&isDev()&&document.visibilityState=='visible')acLoad()},30000);
/* ---------- FILTER GRAFIK: EQUIPMENT, LOKASI, TANGGAL/BULAN/TAHUN ---------- */
const eqList=()=>G.main?[G.main]:D.mains.map(m=>m.id);
const lcList=()=>{if(G.loc)return[G.loc];const ls=[...D.M.locs];D.insp.forEach(i=>{const l=i.loc||'';if(!ls.includes(l))ls.push(l)});return ls};
const eqNm=id=>(mainBy(id)||{}).code||id,lcNm=l=>l||'(tanpa lokasi)';
function selTxt(sel,all,f){if(!sel||sel.length>=all.length)return all.length==1?f(all[0]):'Semua';return sel.length>3?sel.length+' dipilih':sel.map(f).join(', ')}
function gpSec(t,all,sel,fn,labf,tog,id){sel=sel||[];return`<div class="flex justify-between items-center mt-2 mb-1"><b class="text-sm">${t}</b><button class="text-blue-600 text-xs" onclick="${tog}()">${sel.length==all.length?'Hapus semua':'Pilih semua'}</button></div><div id="${id}" style="max-height:150px;overflow-y:auto">${all.map((x,k)=>`<label class="flex items-center gap-2 py-1 text-sm" style="margin:0"><input type="checkbox" ${sel.includes(x)?'checked':''} onchange="${fn}(${k})"> ${esc(labf(x))}</label>`).join('')}</div>`}
function gpR(){const q=['#gpbox','#gpe','#gpl'],o=q.map(k=>{const e=$(k);return e?e.scrollTop:0});render();q.forEach((k,i)=>{const e=$(k);if(e)e.scrollTop=o[i]})}
function gpTe(k){const m=eqList()[k],i=GP.eq.indexOf(m);i<0?GP.eq.push(m):GP.eq.splice(i,1);gpR()}
function gpTl(k){const m=lcList()[k],i=GP.lc.indexOf(m);i<0?GP.lc.push(m):GP.lc.splice(i,1);gpR()}
function gpAllE(){GP.eq=GP.eq.length==eqList().length?[]:[...eqList()];gpR()}
function gpAllL(){GP.lc=GP.lc.length==lcList().length?[]:[...lcList()];gpR()}
const dfOn=()=>!!(G.dd||G.mo||G.yr);
function dOk(i){if(!dfOn())return true;const d=new Date(i.dt);return(!G.yr||d.getFullYear()==G.yr)&&(!G.mo||d.getMonth()+1==G.mo)&&(!G.dd||d.getDate()==G.dd)}
function dateTxt(){return dfOn()?[G.dd?'Tgl '+G.dd:'',G.mo?'Bln '+new Date(2000,G.mo-1,1).toLocaleDateString(LC(),{month:'long'}):'',G.yr?'Thn '+G.yr:''].filter(Boolean).join(' '):(G.days=='all'?'Semua':G.days+' hari')}
function dateFilters(){
  const ys=new Set([new Date().getFullYear()]);D.insp.forEach(i=>{const y=new Date(i.dt).getFullYear();if(y)ys.add(y)});
  const yo=[...ys].sort((a,b)=>b-a).map(String),mo=Array.from({length:12},(_,k)=>[String(k+1),new Date(2000,k,1).toLocaleDateString(LC(),{month:'long'})]),dd=Array.from({length:31},(_,k)=>String(k+1));
  const sel=(k,ph,o)=>`<select class="i" style="width:32%;display:inline-block" onchange="G.${k}=this.value;render()">${opts(o,G[k]||'',ph)}</select>`;
  return`<div class="mt-1"><div class="flex justify-between items-center"><span class="text-xs opacity-60">Filter Tanggal / Bulan / Tahun${dfOn()?' (aktif - filter hari diabaikan)':''}</span>${dfOn()?`<button class="text-blue-600 text-xs" onclick="G.dd=G.mo=G.yr='';render()">Reset</button>`:''}</div>${sel('dd','Semua Tanggal',dd)}${sel('mo','Semua Bulan',mo)}${sel('yr','Semua Tahun',yo)}</div>`}

const appUrl=()=>/^https?:$/.test(location.protocol)?location.origin+location.pathname.replace(/index\.html$/,''):'';
