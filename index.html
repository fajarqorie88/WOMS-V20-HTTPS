var dIP=null;
function showInstall(){if(document.getElementById('ib')||matchMedia('(display-mode: standalone)').matches)return;const b=document.createElement('button');b.id='ib';b.className='b';b.textContent='\u2B07 Install WMS';b.style.cssText='position:fixed;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:25;box-shadow:0 4px 14px #0005';b.onclick=async()=>{if(!dIP)return;dIP.prompt();await dIP.userChoice;dIP=null;b.remove()};document.body.appendChild(b)}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dIP=e;document.body?showInstall():addEventListener('DOMContentLoaded',showInstall)});
addEventListener('appinstalled',()=>{const b=document.getElementById('ib');if(b)b.remove()});
</script>

<script>
/* Appwrite: Project ID sudah diisi di setProject() di bawah */
const AW_DB="6ad9dd52002c9a3515c5", AW_TB="6ad9ddb1003bfff1dbbd";
const AW_BK="6adb08f1000096bf9798";
let client=null, awDB=null, awST=null, awErr="";
try{
  client = new Appwrite.Client()
    .setEndpoint("https://cloud.appwrite.io/v1")
    .setProject("6ad88656002543a81d90");
  awDB = new Appwrite.Databases(client);
  awST = new Appwrite.Storage(client);
  try{client.ping()}catch(e){}
}catch(e){awErr=(e&&e.message)||String(e);console.error("Appwrite init gagal:",e)}
/* Cek kesiapan Appwrite; mengembalikan teks masalah, atau "" kalau siap */
function awCheck(){
  if(typeof Appwrite==="undefined")return "SDK Appwrite gagal dimuat. Cek koneksi internet atau akses ke cdn.jsdelivr.net.";
  if(!awDB)return "Appwrite belum terhubung: "+awErr;
  const pid=client&&client.config&&client.config.project;
  if(!pid||pid==="ID_PROJECT_WMS")return "Project ID belum diisi di index.html (masih ID_PROJECT_WMS).";
  return "";
}
/* Data pengecekan -> Appwrite. ID dokumen = ID record, jadi aman dikirim berulang (tidak dobel) */
let awSyncing=false;
const awRec=r=>{const d=new Date(r.dt);return{
  checker:[r.c1,r.c2].filter(Boolean).join(" / ")||"-",
  job:r.job||"-",
  shift:r.shift||"-",
  tanggal:(isNaN(d)?new Date():d).toISOString(),
  ampere:Number(r.kA),
  deskripsi:r.desc||"",
  json:JSON.stringify(Object.assign({},r,{photo:""}))}};
/* Foto -> Appwrite Storage (bucket AW_BK). Data hanya menyimpan photoId; perangkat lain mengunduh foto dari bucket */
async function awPhotoUp(r){
  if(!r.photo||r.photoId||!awST)return;
  if(r.photo.startsWith("data:")&&r.photo.length>IMG_MAX){const d=await new Promise(ok=>imgPack(r.photo,ok));if(d&&d.length<r.photo.length)r.photo=d}
  const b=await (await fetch(r.photo)).blob(),fid="f"+String(r.id);
  try{await awRetry(()=>awST.createFile(AW_BK,fid,new File([b],fid+".jpg",{type:"image/jpeg"})))}
  catch(e){if(!(e&&e.code==409))throw e}
  r.photoId=fid;
  try{if(typeof _awSave==="function"&&D)_awSave(true)}catch(e){}
}
async function awPhotoGet(r){
  let href="";
  try{
    href=String(awST.getFileView(AW_BK,r.photoId));
    const res=await fetch(href);if(!res.ok)throw new Error("HTTP "+res.status);
    const b=await res.blob();
    r.photo=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(b)});
    return true;
  }catch(e){
    console.error("Foto gagal diunduh:",e);
    if(href){r.photo=href;return true}
    return false;
  }
}
async function awPhotosGet(list){
  let got=0;
  for(let k=0;k<list.length;k+=3){
    const rs=await Promise.all(list.slice(k,k+3).map(awPhotoGet));
    got+=rs.filter(Boolean).length;
  }
  return got;
}
const awWait=ms=>new Promise(z=>setTimeout(z,ms));
/* Kalau kena rate limit (429), tunggu lalu coba lagi: 1.5s, 3s, 6s, 12s, 24s */
async function awRetry(fn){for(let n=0;;n++){try{return await fn()}catch(e){if(!(e&&e.code==429)||n>=5)throw e;await awWait(1500*Math.pow(2,n))}}}
/* Tanda "sudah sinkron": hash isi data (tanpa foto) disimpan per akun, supaya hanya data baru/berubah yang dikirim */
const awSigKey=()=>"wms_sig_"+((typeof U!=="undefined"&&U&&U.id)||"x");
function awSigMap(){try{return JSON.parse(localStorage.getItem(awSigKey())||"{}")}catch(e){return{}}}
function awSig(r){const t=awRec(r).json;let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return h+"."+t.length}
function awSigSet(r){try{const m=awSigMap();m[String(r.id)]=awSig(r);localStorage.setItem(awSigKey(),JSON.stringify(m))}catch(e){}}
function awNeed(r){if(r.photo&&!r.photoId)return true;return awSigMap()[String(r.id)]!==awSig(r)}
async function awUpsert(r){
  if(r.photo&&!r.photoId){try{await awPhotoUp(r)}catch(e){console.error("Foto gagal diunggah:",e);if(typeof toast==="function")toast("Foto gagal diunggah: "+((e&&e.message)||e))}}
  const id=String(r.id),data=awRec(r);
  await awRetry(async()=>{
    try{await awDB.updateDocument(AW_DB,AW_TB,id,data)}
    catch(e){if(e&&e.code==404)await awDB.createDocument(AW_DB,AW_TB,id,data);else throw e}
  });
  awSigSet(r);
}
async function awPut(r){
  try{await awUpsert(r);console.log("Appwrite: data terkirim")}
  catch(e){console.error("Appwrite gagal:",e);if(typeof toast==="function")toast("Appwrite gagal: "+((e&&e.message)||e))}
}
async function awDel(id,pid){
  if(pid&&awST){try{await awST.deleteFile(AW_BK,String(pid))}catch(e){}}
  try{await awDB.deleteDocument(AW_DB,AW_TB,String(id))}catch(e){if(!(e&&e.code==404))console.error("Appwrite hapus gagal:",e)}
}
/* Tarik data dari server yang belum ada di perangkat ini (foto tidak ikut) */
async function awPullAll(silent){
  const u=U;
  try{
    const docs=[];let last=null;
    for(;;){
      const q=[Appwrite.Query.limit(100)];if(last)q.push(Appwrite.Query.cursorAfter(last));
      const r=await awDB.listDocuments(AW_DB,AW_TB,q);
      docs.push(...r.documents);
      if(r.documents.length<100)break;
      last=r.documents[r.documents.length-1].$id;
    }
    if(U!==u||!D)return -1;
    const have=new Map(D.insp.map(x=>[String(x.id),x]));let added=0,upd=0;const pend=[];
    for(const d of docs){
      if(!d.json)continue;
      let o;try{o=JSON.parse(d.json)}catch(e){continue}
      if(!o||!o.id)continue;
      const loc=have.get(String(o.id));
      if(loc){if((o.ea||0)>(loc.ea||0)){const ph=loc.photo,op=loc.photoId;Object.assign(loc,o);loc.photo=(o.photoId||'')==(op||'')?ph:'';upd++;if(!loc.photo&&o.photoId)pend.push(loc)}else if(!loc.photo&&o.photoId){loc.photoId=o.photoId;pend.push(loc)}continue}
      o.photo=o.photo||"";D.insp.push(o);have.set(String(o.id),o);added++;
      if(o.photoId&&!o.photo)pend.push(o);
    }
    const got=pend.length?await awPhotosGet(pend):0;
    if(U!==u||!D)return -1;
    if(added||got||upd){
      D.insp.sort((x,y)=>(y.created||0)-(x.created||0));
      _awSave(true);render();
      {const ps=[];if(added)ps.push(added+" data baru");if(upd)ps.push(upd+" data diperbarui");if(got)ps.push(got+" foto");toast(ps.join(", ")+" diambil dari server")}
    }
    return added;
  }catch(e){
    console.error("Appwrite ambil data gagal:",e);
    if(!silent)toast("Ambil data gagal: "+((e&&e.message)||e));
    return -1;
  }
}
/* Tombol "Upload Data": kirim semua data lokal, lalu ambil data baru dari server */
async function awSyncAll(){
  if(awSyncing){toast("Update sedang berjalan...");return}
  const pre=awCheck();
  if(pre){alert(pre);return}
  awSyncing=true;toast("Memulai update ke server...");
  const P=p=>{if(typeof awProg=="function")awProg(p)};
  try{
    P(3);
    await awPullAll(true);
    P(10);
    const all=(D.insp||[]).slice(),list=all.filter(awNeed);
    let ok=0,fail=0,err="",stop=false;
    for(let k=0;k<list.length&&!stop;k++){
      try{await awUpsert(list[k]);ok++}
      catch(e){fail++;err=(e&&e.message)||String(e);if(e&&e.code==429)stop=true;console.error("Appwrite gagal:",e)}
      toast("Mengirim "+(k+1)+"/"+list.length+"...");
      P(10+80*(k+1)/list.length);
      if(k<list.length-1)await awWait(250);
    }
    const left=list.length-ok-fail,skip=all.length-list.length;
    P(92);
    const added=stop?0:await awPullAll(true);
    let m=ok+" data terkirim";
    if(skip>0)m+=", "+skip+" data sudah sinkron";
    if(added>0)m+=", "+added+" data baru dari server";
    if(fail)m+=", gagal "+fail+": "+err;
    if(left>0)m+=", "+left+" data belum dikirim";
    if(added<0&&!fail)m+=" (ambil data dari server gagal)";
    if(!all.length&&added===0){toast("Belum ada data di perangkat ini, server juga kosong")}
    else if(!fail&&!left&&added>=0){P(100);awSuccess("Update berhasil",m)}
    else alert(m+(stop?"\n\nBatas request server tercapai. Tunggu sekitar 1 menit lalu klik Upload Data lagi. Hanya data yang belum terkirim yang akan dikirim.":""));
  }catch(e){
    console.error("Update gagal:",e);alert("Update gagal: "+((e&&e.message)||e));
  }finally{awSyncing=false}
}
/* Suara "cling" (sintesis Web Audio, tanpa file) */
let awAC=null;
function awAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!awAC)awAC=new C();if(awAC.state==="suspended")awAC.resume();return awAC}catch(e){return null}}
document.addEventListener("pointerdown",awAudio,{passive:true});
function awCling(){
  try{if(localStorage.getItem("woms_mute")==="1")return}catch(e){}
  const a=awAudio();if(!a)return;
  try{
    const t=a.currentTime,g=a.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
    g.connect(a.destination);
    [[1318.5,0],[1975.5,0.09],[2637,0.09]].forEach(([f,d],i)=>{
      const o=a.createOscillator(),h=a.createGain();
      o.type="sine";o.frequency.value=f;h.gain.value=i==2?0.25:1;
      o.connect(h);h.connect(g);o.start(t+d);o.stop(t+1.2);
    });
  }catch(e){}
}
/* Animasi centang + notifikasi berhasil */
function awSuccess(title,sub){try{hap('ok')}catch(e){}
  if(!document.getElementById("aw-css")){
    const st=document.createElement("style");st.id="aw-css";
    st.textContent=".aw-ok{position:fixed;top:0;left:0;width:100%;height:100%;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);animation:awf .2s}"+
    ".aw-card{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cd,#fff);color:var(--tx,#0f172a);border-radius:16px;padding:16px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:awp .3s;max-width:80%}"+
    ".aw-ok svg{display:block;margin:0 auto;flex:none}"+
    ".aw-ok circle{transform:rotate(-90deg);transform-origin:26px 26px}"+
    ".aw-ok circle{stroke-dasharray:166;stroke-dashoffset:166;animation:awd .6s .1s forwards}"+
    ".aw-ok path{stroke-dasharray:48;stroke-dashoffset:48;animation:awd .4s .6s forwards}"+
    "@keyframes awd{to{stroke-dashoffset:0}}@keyframes awf{from{opacity:0}}@keyframes awp{from{transform:scale(.8);opacity:0}}";
    document.head.appendChild(st);
  }
  const t=document.getElementById("t");if(t)t.style.display="none";
  const old=document.querySelector(".aw-ok");if(old)old.remove();
  const d=document.createElement("div");d.className="aw-ok";
  d.innerHTML='<div class="aw-card"><svg width="52" height="52" viewBox="-2 -2 56 56" fill="none" stroke="#16a34a" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="26" r="24" stroke-width="3"/><path d="M14 26l8 8 16-16" stroke-width="4"/></svg><div style="font-weight:700;font-size:15px;margin-top:6px">'+title+'</div><div style="font-size:12px;opacity:.7;margin-top:2px">'+sub+'</div></div>';
  d.onclick=()=>d.remove();
  document.body.appendChild(d);
  awCling();
  try{const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;if(H&&H.impact)H.impact({style:"LIGHT"});else if(navigator.vibrate)navigator.vibrate(40)}catch(e){}
  setTimeout(()=>{if(d.parentNode)d.remove()},2400);
}
</script>

.wl.wl-st{width:min(132px,40vw);margin:0 auto;cursor:default;animation:none!important}
.wl-st .wl-t{transform:none!important;transition:none}
.wl-st .wl-f,.wl-st .wl-img{animation:none!important}
.wl-img,.wl-sh,.wl-gl{-webkit-mask:var(--wlm) center/100% 100% no-repeat;mask:var(--wlm) center/100% 100% no-repeat}
.wl-vd{position:absolute;inset:0;object-fit:cover;pointer-events:none;background:transparent}
.wl-gl{position:absolute;inset:0;pointer-events:none;border-radius:21%;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.55),rgba(125,211,252,.18) 28%,transparent 55%);mix-blend-mode:soft-light;opacity:var(--go,0);transition:opacity .3s}
.wl-rp{position:absolute;inset:0;border-radius:21%;pointer-events:none;border:3px solid rgba(125,211,252,.9);box-shadow:0 0 24px rgba(56,189,248,.8);animation:wlRip .8s ease-out forwards}
@keyframes wlRip{from{opacity:.95;transform:scale(1)}to{opacity:0;transform:scale(1.45)}}
.wl.pop .wl-f{animation:wlPop .75s cubic-bezier(.3,1.4,.5,1)}
@keyframes wlIn{from{opacity:0;transform:scale(.55) translateY(24px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes wlFloat{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-9px) rotate(1.2deg)}}
@keyframes wlGlow{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.12) saturate(1.2)}}
@keyframes wlShine{0%,55%{background-position:130% 0}100%{background-position:-30% 0}}
@keyframes wlSpark{0%,100%{transform:scale(0) rotate(0)}12%{transform:scale(1.5) rotate(45deg)}30%{transform:scale(0) rotate(90deg)}}
@keyframes wlPop{0%{transform:scale(1) rotateY(0)}45%{transform:scale(1.14) rotateY(200deg)}100%{transform:scale(1) rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.wl,.wl-f,.wl-img,.wl-sh,.wl-sp,.wl-rp,.wl.pop .wl-f{animation:none!important}.wl-t{transition:none}}
.spw{height:4px;border-radius:2px;background:rgba(128,128,128,.2);overflow:hidden;margin-top:8px}.spw div{height:100%;width:0;border-radius:2px;transition:width .45s ease,background .2s}
.ig{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52vh;text-align:center}
.inow{position:relative;display:flex;align-items:center;gap:0;width:min(320px,86%);height:68px;padding:0 22px 0 8px;border:0;border-radius:40px;color:#fff;cursor:pointer;background:linear-gradient(180deg,#3b8fd6,#2a6fb0);box-shadow:0 6px 16px rgba(37,99,235,.35),inset 0 1px 0 rgba(255,255,255,.35);animation:inPulse 2.4s ease-in-out infinite;transition:transform .15s,width .35s,border-radius .35s;-webkit-tap-highlight-color:transparent}
.inow .ic{flex:0 0 52px;height:52px;border-radius:50%;background:#fff;color:#2a6fb0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.inow .ic svg{width:26px;height:26px;transform-origin:20% 90%}
.inow .tx{flex:1;text-align:center;font-weight:800;letter-spacing:.06em;font-size:20px}
.inow:active{transform:scale(.96)}
.inow.go{animation:none;width:68px;padding:0 8px;border-radius:50%}
.inow.go .tx{opacity:0;width:0;flex:0;overflow:hidden;transition:opacity .15s}
.inow.go .ic svg{animation:inWrite .5s ease-in-out infinite}
@keyframes inPulse{0%,100%{box-shadow:0 6px 16px rgba(37,99,235,.35),0 0 0 0 rgba(59,143,214,.5)}50%{box-shadow:0 6px 16px rgba(37,99,235,.35),0 0 0 14px rgba(59,143,214,0)}}
@keyframes inWrite{0%,100%{transform:rotate(-12deg) translate(0,0)}50%{transform:rotate(10deg) translate(3px,-3px)}}
.in-ov{position:fixed;inset:0;z-index:9998;background:linear-gradient(135deg,#2a6fb0,#1d4ed8);clip-path:circle(0 at var(--x) var(--y));transition:clip-path .62s cubic-bezier(.65,0,.35,1),opacity .4s;display:flex;align-items:center;justify-content:center;pointer-events:all}
.in-ov.on{clip-path:circle(160% at var(--x) var(--y))}
.in-ov.off{opacity:0}
.in-ov-c{color:#fff;text-align:center;opacity:0;transform:scale(.7);transition:all .4s .25s}
.in-ov.on .in-ov-c{opacity:1;transform:none}
.in-ov-c svg{width:54px;height:54px;display:block;margin:0 auto 8px}.in-ov-c b{font-size:26px;letter-spacing:.08em}
.stp-in{animation:stpIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes stpIn{from{opacity:0;transform:translateY(32px) scale(.97)}to{opacity:1;transform:none}}
/* ===== MODE TAMPILAN PC (futuristik, widescreen) ===== */
html[data-view=pc][data-theme=dark]{--bg:#050b1a;--cd:rgba(13,25,50,.72);--tx:#e6f1ff;--bd:rgba(56,189,248,.24);--ac:#38bdf8;--ib:rgba(2,10,28,.65)}
html[data-view=pc]:not([data-theme=dark]){--bg:#e8f1fb;--cd:rgba(255,255,255,.78);--tx:#0b1b33;--bd:rgba(2,132,199,.28);--ac:#0284c7;--ib:rgba(255,255,255,.8)}
html[data-view=pc] body{font-size:15px;padding-bottom:0;background:radial-gradient(1100px 560px at 88% -8%,rgba(56,189,248,.20),transparent 62%),radial-gradient(900px 520px at 6% 108%,rgba(99,102,241,.20),transparent 62%),var(--bg);background-attachment:fixed}
html[data-view=pc] body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(56,189,248,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.07) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 60% 40%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse at 60% 40%,#000 25%,transparent 78%)}
html[data-view=pc] body.wn{padding-left:208px}
html[data-view=pc] #app{position:relative;z-index:1;max-width:1760px!important;padding:6px 36px 48px!important}
html[data-view=pc] body:not(.wn) #app{max-width:920px!important}
html[data-view=pc] nav{top:0;bottom:0;right:auto;left:0;width:208px;flex-direction:column;justify-content:flex-start;gap:4px;padding:16px 10px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#38bdf8 rgba(56,189,248,.12);background:linear-gradient(180deg,rgba(2,8,23,.97),rgba(7,18,44,.97));border-right:1px solid rgba(56,189,248,.28);box-shadow:6px 0 44px rgba(14,165,233,.14);z-index:20}
html[data-view=pc] nav::before{content:"\26A1  WMS";order:-2;display:block;flex:none;font-weight:800;font-size:21px;letter-spacing:.16em;color:#e0f2fe;text-shadow:0 0 16px rgba(56,189,248,.85);padding:6px 10px 0}
html[data-view=pc] nav::after{content:"WELDING MONITORING SYSTEM";order:-1;display:block;font-size:10px;letter-spacing:.2em;color:#64a8d8;padding:2px 12px 12px;margin-bottom:6px;flex:none;border-bottom:1px solid rgba(56,189,248,.22)}
html[data-view=pc] nav button{background:transparent;flex:none;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7f93b5;border:1px solid transparent;transition:all .2s}
html[data-view=pc] nav button::before{content:"\25C6";width:22px;text-align:center;font-size:16px}
html[data-view=pc] nav button[data-k=input]::before{content:"\271A"}
html[data-view=pc] nav button[data-k=data]::before{content:"\25A4"}
html[data-view=pc] nav button[data-k=grafik]::before{content:"\2197"}
html[data-view=pc] nav button[data-k=master]::before{content:"\25C8"}
html[data-view=pc] nav button[data-k=setting]::before{content:"\2699"}
html[data-view=pc] nav button:hover{color:#e0f2fe;background:rgba(56,189,248,.09)}
html[data-view=pc] nav button.on{color:#e0f2fe;font-weight:700;background:linear-gradient(90deg,rgba(14,165,233,.30),rgba(99,102,241,.14));border-color:rgba(56,189,248,.55);box-shadow:0 0 20px rgba(14,165,233,.28),inset 3px 0 0 #38bdf8}
html[data-view=pc] .vw{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;align-items:start}
html[data-view=pc] .vw>*{grid-column:1/-1;margin:0}
html[data-view=pc] .vw>.c{grid-column:span 6}
html[data-view=pc] .vw-data>.c,html[data-view=pc] .vw-setting>.c{grid-column:span 4}
html[data-view=pc] .vw>.c:has(>select.i),html[data-view=pc] .vw>.c.grid-cols-4,html[data-view=pc] .vw>.c.overflow-x-auto{grid-column:1/-1}
html[data-view=pc] .vw-input{max-width:1040px;margin:0 auto}
html[data-view=pc] .vw-input>.c{grid-column:1/-1}
html[data-view=pc] .vw-master{padding-bottom:96px}
html[data-view=pc] .vw-grafik>.flex:first-child{order:-4}
html[data-view=pc] .vw-grafik>.c:has(>select.i){order:-3}
html[data-view=pc] .vw-grafik>.c.grid-cols-4{order:-2}
html[data-view=pc] .vw-grafik>.c.overflow-x-auto{order:2}
html[data-view=pc] .vw-grafik>.c,html[data-view=pc] .vw-grafik>.c.cal{grid-column:1/-1;max-width:none}
html[data-view=pc] :is(.vw-grafik,.vw-data) .cal-g,html[data-view=pc] :is(.vw-grafik,.vw-data) .cal-w{gap:8px}
html[data-view=pc] :is(.vw-grafik,.vw-data) .cal-d{aspect-ratio:auto;height:54px;max-height:none;font-size:17px}
html[data-view=pc] :is(.vw-grafik,.vw-data) .cal-w span{font-size:13px}
html[data-view=pc] :is(.vw-grafik,.vw-data) .cal-g{min-height:0}
html[data-view=pc] .vw-grafik .grid-cols-4 b{font-size:30px;color:var(--ac);text-shadow:0 0 14px rgba(56,189,248,.55)}
html[data-view=pc] .vw select.i[style*="width:48%"]{width:auto!important;min-width:190px;margin-right:10px}
html[data-view=pc] h2{font-size:21px;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(90deg,#38bdf8,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent;padding-top:14px;padding-bottom:14px}
html[data-view=pc] h3{letter-spacing:.08em;color:var(--ac);text-transform:uppercase;font-size:14px}
html[data-view=pc] .c{position:relative;background:var(--cd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 10px 34px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.025);transition:border-color .2s,box-shadow .2s}
html[data-view=pc] .c::before{content:"";position:absolute;top:0;left:22px;right:22px;height:1px;background:linear-gradient(90deg,transparent,var(--ac),transparent);opacity:.75;pointer-events:none}
html[data-view=pc] .c:hover{border-color:rgba(56,189,248,.55);box-shadow:0 10px 34px rgba(0,0,0,.22),0 0 26px rgba(56,189,248,.14)}
html[data-view=pc] .i{background:var(--ib);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;transition:all .2s}
html[data-view=pc] .i:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(56,189,248,.25)}
/* Halaman login mode PC: kotak input transparan seperti mode HP */
html[data-view=pc] .lg .i{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
html[data-view=pc] .lg .i:focus{background:rgba(255,255,255,.14);border-color:#38bdf8}
.lg .i:-webkit-autofill,.lg .i:-webkit-autofill:hover,.lg .i:-webkit-autofill:focus{-webkit-text-fill-color:#fff;caret-color:#fff;transition:background-color 99999s ease-in-out 0s}

let SC={t:0,busy:false,err:'',files:0,fb:0,docs:0,db:0};

async function scLoad(force){
  if(SC.busy||(!force&&Date.now()-SC.t<300000))return;
  const pre=awCheck();if(pre){SC.err=pre;SC.t=Date.now();return}
  SC.busy=true;SC.err='';render();
  try{
    let fb=0,fn=0,last=null;
    for(;;){const q=[Appwrite.Query.limit(100)];if(last)q.push(Appwrite.Query.cursorAfter(last));
      const r=await awST.listFiles(AW_BK,q);r.files.forEach(f=>{fb+=f.sizeOriginal||0;fn++});
      if(r.files.length<100)break;last=r.files[r.files.length-1].$id}
    let db=0,dn=0;last=null;
    for(;;){const q=[Appwrite.Query.limit(100)];if(last)q.push(Appwrite.Query.cursorAfter(last));
      const r=await awDB.listDocuments(AW_DB,AW_TB,q);r.documents.forEach(d=>{db+=JSON.stringify(d).length;dn++});
      if(r.documents.length<100)break;last=r.documents[r.documents.length-1].$id}
    Object.assign(SC,{files:fn,fb,docs:dn,db});SC.t=Date.now();
    if((fb+db)/scCap()>=0.8)toast('Peringatan: kapasitas server sudah '+Math.round((fb+db)/scCap()*100)+'%')
  }catch(e){SC.err=(e&&e.message)||String(e);SC.t=Date.now()}
  SC.busy=false;if(tab=='setting')render()}

  return `<div class="c text-sm"><div class="flex justify-between items-center"><b>Kapasitas Server</b><button class="b" onclick="scLoad(true)" ${SC.busy?'disabled':''}>${SC.busy?'Memuat...':'&#8635; Refresh'}</button></div>
${SC.err?`<p class="text-xs my-2" style="color:#dc2626">Gagal membaca kapasitas: ${esc(SC.err)}</p>`:SC.t?`<p class="my-2"><b>${fmtB(used)}</b> terpakai dari <b>${fmtB(cap)}</b> (${pc.toFixed(1)}%)</p>

function mm(op,a,b,k,v){const m=draft[a];
if(op=='addMain'){const c=prompt('Kode Main Equipment (mis. Trafo 24)');if(!c)return;draft.push({id:'m'+uid8(),code:c,loc:D.M.locs[0]||'',subs:[]})}
else if(op=='delMain'){if(confirm('Hapus '+m.code+'?'))draft.splice(a,1)}
else if(op=='loc')m.loc=b;
else if(op=='mc')m.code=b.trim()||m.code;
else if(op=='addSub')m.subs.push({id:'s'+uid8(),name:'',type:'C-Type',mats:[]});
else if(op=='delSub')m.subs.splice(b,1);
else if(op=='sn')m.subs[b].name=k;else if(op=='st')m.subs[b].type=k;
else if(op=='addMat')m.subs[b].mats.push({id:'x'+uid8(),mt:D.M.mats[0]||'',tg:0,al:'',min:0,max:0});
else if(op=='delMat')m.subs[b].mats.splice(k,1);
else if(op=='mt')m.subs[b].mats[k].mt=v;
else if(op=='tg'){const x=m.subs[b].mats[k],t=parseFloat(v)||0;x.tg=r2(t);if(x.al!=null&&x.al!==''){x.min=Math.max(0,r2(t*(1-x.al/100)));x.max=r2(t*(1+x.al/100))}else{x.min=Math.max(0,r2(t-0.5));x.max=r2(t+0.5)}}
else if(op=='al'){const x=m.subs[b].mats[k],p=parseFloat(v);if(v===''||isNaN(p)){x.al=''}else{const q=Math.max(0,p),t=tgOf(x);x.al=r2(q);x.min=Math.max(0,r2(t*(1-q/100)));x.max=r2(t*(1+q/100))}}
else if(op=='min'||op=='max'){const x=m.subs[b].mats[k];x[op]=parseFloat(v)||0;x.tg=r2((x.min+x.max)/2);x.al=x.tg>0?r2((x.max-x.min)/2/x.tg*100):''}
render()}

let swClose=()=>{};
(function(){const W=84;let s=null,open=null,sup=0;
 const shut=c=>{if(!c)return;c.classList.remove('open');const n=c.querySelector('.sw-in');if(n)n.style.transform='';if(open===c)open=null};
 swClose=()=>shut(open);
 document.addEventListener('pointerdown',e=>{
  if(open&&!document.contains(open))open=null;
  const t=e.target.closest?e.target:e.target.parentNode;if(t.closest('.sw-del'))return;
  const inn=t.closest('.sw-in');
  if(open&&(!inn||inn.parentNode!==open))shut(open);
  if(!inn||(e.pointerType=='mouse'&&e.button!==0))return;
  const c=inn.parentNode;c.classList.remove('hint');inn.style.animation='none';
  s={c,inn,x:e.clientX,y:e.clientY,base:c.classList.contains('open')?-W:0,id:e.pointerId,lock:null,t:0}});
 document.addEventListener('pointermove',e=>{
  if(!s||e.pointerId!==s.id)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;
  if(s.lock===null){if(Math.abs(dx)<6&&Math.abs(dy)<6)return;s.lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
   if(s.lock=='x'){s.inn.classList.add('drag');s.c.classList.add('drag');try{s.inn.setPointerCapture(e.pointerId)}catch(x){}}}
  if(s.lock!=='x')return;
  s.t=Math.min(0,Math.max(-W-20,s.base+dx));s.inn.style.transform='translateX('+s.t+'px)'});
 const end=e=>{if(!s||e.pointerId!==s.id)return;const{c,inn}=s;inn.classList.remove('drag');c.classList.remove('drag');
  if(s.lock=='x'){sup=Date.now();
   if(s.t<-W/2){if(open&&open!==c)shut(open);c.classList.add('open');open=c;inn.style.transform='translateX(-'+W+'px)'}
   else{c.classList.remove('open');if(open===c)open=null;inn.style.transform=''}}
  s=null};
 document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
 document.addEventListener('click',e=>{
  if(Date.now()-sup<350){e.stopPropagation();e.preventDefault();sup=0;return}
  const t=e.target.closest?e.target:e.target.parentNode,inn=t.closest('.sw-in');
  if(inn&&inn.parentNode.classList.contains('open')){e.stopPropagation();e.preventDefault();shut(inn.parentNode)}},true);
})();

const AW_MT="6ad9e3270004fcc8e26d", AW_CH=15000;

async function awMasterPull(){
  const u=U;
  try{
    const h=awHdr((await awDB.getDocument(AW_DB,AW_MT,'master_0')).data);
    if(!h) throw {code:404};
    let txt=h.body;
    for(let i=1;i<h.n;i++){const c=awHdr((await awDB.getDocument(AW_DB,AW_MT,'master_'+i)).data);txt+=c?c.body:''}
    const o=JSON.parse(txt);
    if(U!==u||!D) return;
    if(!D.masterT||o.t>D.masterT){
      D.mains=o.mains;D.M=o.M;D.masterT=o.t;norm();_awSave(true);awLast=awSnap();
      render();toast('Master diperbarui dari server');
    }else if(D.masterT>o.t){awLast='';awMasterPush()}
    else awLast=awSnap();
  }catch(e){
    if(e&&e.code==404&&U===u&&D){D.masterT=D.masterT||Date.now();_awSave(true);awLast='';awMasterPush()}
    else console.error('Appwrite master (ambil) gagal:',e);
  }
}
async function awMasterPush(){
  if(!D||!U)return false;
  if(awBusy){clearTimeout(awT);awT=setTimeout(awMasterPush,1500);return false}
  awBusy=true;
  try{
    const snap=awSnap();
    const json=JSON.stringify({t:D.masterT||Date.now(),mains:D.mains,M:D.M});
    const parts=[];for(let i=0;i<json.length;i+=AW_CH)parts.push(json.slice(i,i+AW_CH));
    let oldN=0;
    try{const h=awHdr((await awDB.getDocument(AW_DB,AW_MT,'master_0')).data);if(h)oldN=h.n}catch(e){}
    for(let i=0;i<parts.length;i++){
      const id='master_'+i,data={data:i+'/'+parts.length+'|'+parts[i]};
      try{await awDB.updateDocument(AW_DB,AW_MT,id,data)}
      catch(e){if(e&&e.code==404)await awDB.createDocument(AW_DB,AW_MT,id,data);else throw e}
    }
    for(let k=parts.length;k<oldN;k++){try{await awDB.deleteDocument(AW_DB,AW_MT,'master_'+k)}catch(e){}}
    awLast=snap;console.log('Appwrite: master terkirim');awBusy=false;return true;
  }catch(e){console.error('Appwrite master (kirim) gagal:',e);toast('Master gagal dikirim: '+((e&&e.message)||e))}
  awBusy=false;return false;
}

async function awUpdateServer(){
  if(awSyncing){toast("Update sedang berjalan...");return}
  const pre=awCheck();
  if(pre){alert(pre);return}
  if(!D||!U)return;
  awSyncing=true;toast("Mengirim setting ke server...");SC.t=0;spSet(8,false);
  try{
    clearTimeout(awT);D.masterT=Date.now();_awSave(true);
    let mok=await awMasterPush();
    if(!mok){await new Promise(z=>setTimeout(z,1600));mok=await awMasterPush()}
    spSet(30,false);
    await awPullAll(true);spSet(40,false);
    let ok=0,fail=0,err="",stop=false;
    const all=(D.insp||[]).slice(),list=all.filter(awNeed);
    for(let k=0;k<list.length&&!stop;k++){
      try{await awUpsert(list[k]);ok++}
      catch(e){fail++;err=(e&&e.message)||String(e);if(e&&e.code==429)stop=true;console.error("Appwrite gagal:",e)}

      if(k<list.length-1)await awWait(250);
    }

    if(added>0)m+=", "+added+" data baru dari server";
    if(fail)m+=", gagal "+fail+": "+err;
    if(added<0&&!fail)m+=" (ambil data dari server gagal)";
    const good=mok&&!fail&&added>=0;

    if(good){D.sync.last=new Date().toLocaleString(LC());_awSave(true);awSuccess("Update berhasil",m)}
    else alert(m+(stop?"\n\nBatas request server tercapai. Tunggu sekitar 1 menit lalu coba lagi. Hanya data yang belum terkirim yang akan dikirim.":""));
    render();
  }catch(e){
    console.error("Update gagal:",e);spSet(100,true,true);alert("Update gagal: "+((e&&e.message)||e));
  }finally{awSyncing=false}
}
async function awSaveSync(r){
  const pre=awCheck();
  if(pre){toast("Tersimpan di perangkat. Server: "+pre);spSet(100,true,true);return}
  if(awSyncing){spSet(30,false);try{await awUpsert(r);spSet(100,false,true)}catch(e){spSet(100,true,true);toast("Kirim ke server gagal: "+((e&&e.message)||e))}return}
  awSyncing=true;toast("Mengirim ke server...");spSet(8,false);
  try{
    await awUpsert(r);spSet(40,false);
    let mok=true;
    if(D&&awLast!==null&&awSnap()!==awLast){clearTimeout(awT);D.masterT=Date.now();_awSave(true);mok=await awMasterPush()}
    spSet(60,false);
    await awMasterPull();spSet(78,false);
    const added=await awPullAll(true);spSet(94,false);
    if(D){D.sync.last=new Date().toLocaleString(LC());_awSave(true)}
    spSet(100,!(mok&&added>=0),true);
    let m="Data terkirim ke server";
    if(added>0)m+=", "+added+" data baru dari perangkat lain";
    if(mok&&added>=0)awSuccess("Tersimpan & terupdate",m);
    else alert(m+(mok?"":" (master gagal dikirim)")+(added<0?" (ambil data dari server gagal)":""));
  }catch(e){
    console.error("Simpan & update server gagal:",e);spSet(100,true,true);
    alert("Data tersimpan di perangkat, tetapi gagal dikirim ke server: "+((e&&e.message)||e)+". Coba lagi lewat tombol Upload Data di tab Data.");
  }finally{awSyncing=false}
}

const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');

async function pbk(p,s){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return hx(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:s,iterations:150000},k,256))}
