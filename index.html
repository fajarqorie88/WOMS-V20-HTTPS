function renM(k,i){const o=D.M[k][i],n=(prompt('Ubah nama',o)||'').trim();if(!n||n==o)return;if(D.M[k].includes(n))return toast('Nama sudah ada');D.M[k][i]=n;if(k=='locs'){D.mains.forEach(m=>{if(m.loc==o)m.loc=n});if(draft)draft.forEach(m=>{if(m.loc==o)m.loc=n})}save();render()}
function delM(k,i){const v=D.M[k][i];if(k=='locs'&&D.mains.concat(draft||[]).some(m=>m.loc==v)&&!confirm('Lokasi "'+v+'" dipakai Main Equipment. Hapus dan kosongkan lokasinya di Master?'))return;D.M[k].splice(i,1);if(k=='locs'){D.mains.forEach(m=>{if(m.loc==v)m.loc=''});if(draft)draft.forEach(m=>{if(m.loc==v)m.loc=''})}save();render()}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function bk(){dl(`WMS_backup_${U.id}_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(D),'application/json')}
function rs(f){if(!f)return;const r=new FileReader();r.onload=e=>{try{D=JSON.parse(e.target.result);load_fix();if(SERVER)D.insp.forEach(cloudPut);save(true);draft=null;toast('Restore berhasil');render()}catch(x){toast('File tidak valid')}};r.readAsText(f)}
function load_fix(){D.M=D.M||def().M;D.prof=D.prof||def().prof;D.sync=D.sync||{last:null,auto:true};norm()}
function fromDrive(){const r=L['woms_drive_'+U.id];if(!r)return toast('Belum ada backup Drive');D=JSON.parse(r).data;save(true);draft=null;toast('Dimuat dari Drive');render()}
function wipe(){if(confirm('Hapus semua data akun ini?')){if(SERVER)D.insp.forEach(i=>cloudDel(i.id));D=def();save(true);draft=null;render()}}
function xl(){if(!window.XLSX)return toast('Library Excel belum termuat');const wb=XLSX.utils.book_new(),jts=a=>XLSX.utils.json_to_sheet(a.map(o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[tr(k),v]))));
XLSX.utils.book_append_sheet(wb,jts(D.insp.map(i=>({Waktu:i.dt,Main:i.main,Sub:i.sub,Type:i.subType,Material:i.mat,Aktual_kA:i.kA,Std_Min:i.min,Std_Max:i.max,Status:i.status,Checker1:i.c1,Checker2:i.c2,Shift:i.shift,Lokasi:i.loc,Description:i.desc,Job:i.job,Keterangan:i.ket}))),tr('Inspeksi'));
const mr=[];D.mains.forEach(m=>m.subs.forEach(s=>s.mats.forEach(x=>mr.push({Main:m.code,Lokasi:m.loc,Sub:s.name,Type:s.type,Material:x.mt,Target:tgOf(x),Min:x.min,Max:x.max}))));
XLSX.utils.book_append_sheet(wb,jts(mr),'Master');
XLSX.utils.book_append_sheet(wb,jts(D.mains.map(m=>{const a=D.insp.filter(i=>i.mid==m.id);return{Main:m.code,Jumlah:a.length,OK:a.filter(i=>i.status=='OK').length,NG:a.filter(i=>i.status=='NG').length}})),tr('Ringkasan'));
XLSX.writeFile(wb,`WMS_${U.id}_${new Date().toISOString().slice(0,10)}.xlsx`)}

/* ---------- FRONT PAGE ---------- */
const MENUS=[['cow','Check Output Welding','Input, data, grafik & master arus welding','\u26A1'],['qg','Quality Gate','Segera hadir','\u2705']];
function homeView(){const nm=esc((D.prof&&D.prof.name)||U.name||'');
return`<div class="lg"><div class="in"><div class="text-right text-xs mb-3" style="color:#93c5fd"><button class="underline" style="font-weight:${LG=='id'?700:400}" onclick="setLang('id')">ID</button> | <button class="underline" style="font-weight:${LG=='en'?700:400}" onclick="setLang('en')">EN</button></div>
<div class="text-center mb-6"><div class="logo text-4xl font-extrabold tracking-wide">WMS</div><p class="text-sm mt-2" style="color:#bfdbfe">Selamat datang${nm?', '+nm:''}</p><p class="text-xs mt-1" style="color:#93c5fd">Pilih menu untuk memulai</p></div>
${MENUS.map(([k,t,d,ic])=>`<button class="glass w-full text-left flex items-center gap-4 mb-3" onclick="openMenu('${k}')" style="color:#f1f5f9"><span style="width:52px;height:52px;border-radius:14px;background:#2563EB;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none">${ic}</span><span class="flex-1"><b class="block text-base">${t}</b><span class="text-xs" style="color:#cbd5e1">${d}</span></span><span style="font-size:22px;color:#93c5fd">&#8250;</span></button>`).join('')}
<button class="text-xs underline mt-4 mx-auto" style="color:#93c5fd" onclick="logout()">Logout</button></div></div>`}
function qgView(){return`<div class="lg"><div class="in"><button class="text-sm mb-4 self-start" style="color:#93c5fd" onclick="openMenu('home')">&#8249; Kembali ke Menu</button>
<div class="glass text-center"><div style="font-size:44px">&#9989;</div><h2 class="font-bold text-lg mt-2">Quality Gate</h2><p class="text-sm mt-1" style="color:#cbd5e1">Fitur ini sedang disiapkan.</p></div></div></div>`}
function openMenu(k){scr=k=='cow'?'app':k;if(k=='cow')tab='input';scrollTo(0,0);render()}
function backBar(){return`<div class="pt-3"><button class="text-sm text-blue-600 font-semibold" onclick="openMenu('home')">&#8249; Kembali ke Menu</button></div>`}

/* ---------- RENDER ---------- */
function render(){const y=scrollY;if(!U){$('#app').innerHTML=loginView();trDom($('#app'));return}
if(scr!='app'){const n0=$('nav');if(n0)n0.remove();$('#app').innerHTML=scr=='qg'?qgView():homeView();trDom($('#app'));return}
const v={input:inputView,data:dataView,grafik:grafikView,master:masterView,setting:settingView}[tab]();
$('#app').innerHTML=backBar()+v;let n=$('nav');if(!n){n=document.createElement('nav');document.body.appendChild(n)}
n.innerHTML=TABS.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${l}${k=='master'&&pend()?' &#9679;':''}</button>`).join('');
trDom($('#app'));trDom(n);
if(tab=='grafik')matList().forEach((m,k)=>draw($('#cv'+k),false,m));scrollTo(0,y)}
function go(t){tab=t;scrollTo(0,0);render()}
(function init(){document.documentElement.dataset.theme=L.woms_theme||'light';
if(!SERVER)try{const u=JSON.parse(L.woms_user||'null');if(u){U=u;load(u.id)}}catch(e){}
render();if(!U){const n=$('nav');if(n)n.remove()}})();
const _r=render;render=function(){_r();if(!U){const n=$('nav');if(n)n.remove()}};
if(SERVER)fbInit();
</script></body></html>
